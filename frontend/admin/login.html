<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdf">
  <title>Đăng nhập Admin | Mộc Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-layout.css') }}">
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body class="admin-body admin-login-body">
  <main class="auth-panel admin-login-panel">
    <a class="brand admin-login-brand" href="{{ url_for('main.index') }}" aria-label="Mộc Market">
      <span class="brand-mark" aria-hidden="true">m</span>
      <span class="brand-wordmark"><strong>MỘC</strong><small>QUẢN TRỊ CỬA HÀNG</small></span>
    </a>
    <p class="eyebrow">KHU VỰC QUẢN TRỊ</p>
    <h1>Đăng nhập Admin</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash-wrap" role="status" aria-live="polite">{% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}</div>{% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('admin.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Đăng nhập</button>
    </form>
    <a class="admin-login-store-link" href="{{ url_for('main.index') }}">Quay lại cửa hàng</a>
  </main>
</body>
</html>
